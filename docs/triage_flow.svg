<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1280"
     font-family="'Helvetica Neue', Helvetica, Arial, 'Segoe UI', sans-serif">

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#7B8794"/>
    </marker>
    <marker id="arr-t" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#00A9CE"/>
    </marker>
  </defs>

  <rect width="1200" height="1280" fill="#ffffff"/>

  <!-- ===== Header ===== -->
  <rect x="0" y="0" width="1200" height="6" fill="#00A9CE"/>

  <text x="80" y="54" font-size="13" font-weight="700" fill="#00A9CE" letter-spacing="2">FRIDAY LEARNING SERIES: AGENTIC SYSTEM DESIGN</text>
  <text x="80" y="96" font-size="29" font-weight="700" fill="#051C2C">The model orchestrates; deterministic tools produce every number.</text>
  <text x="80" y="126" font-size="15" fill="#5C6B7A">How the DDR Triage Agent turns ~1,380 daily drilling reports into a one-page morning memo &#8212; without hallucinating the data.</text>

  <line x1="80" y1="150" x2="1120" y2="150" stroke="#DBE1E8" stroke-width="1.5"/>

  <!-- ===== Stage 1: Data preparation ===== -->
  <circle cx="92" cy="188" r="12" fill="#051C2C"/>
  <text x="92" y="193" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <text x="115" y="193" font-size="15" font-weight="700" fill="#051C2C" letter-spacing="0.5">DATA PREPARATION</text>
  <text x="330" y="193" font-size="13" fill="#7B8794">runs once, offline &#183; the AI never sees a raw file</text>

  <!-- Box A: raw -->
  <rect x="80" y="220" width="290" height="96" rx="6" fill="#F4F6F8" stroke="#DBE1E8" stroke-width="1.5"/>
  <text x="100" y="248" font-size="10" font-weight="700" fill="#7B8794" letter-spacing="1">INPUT</text>
  <text x="100" y="274" font-size="16" font-weight="700" fill="#051C2C">Raw DDR XML</text>
  <text x="100" y="294" font-size="11" fill="#5C6B7A">~1,380 reports &#183; 26 wells &#183; WITSML</text>
  <text x="100" y="310" font-size="11" font-weight="600" fill="#B0392E">Not committed (gitignored)</text>

  <!-- Box B: parser -->
  <rect x="455" y="220" width="290" height="96" rx="6" fill="#F4F6F8" stroke="#DBE1E8" stroke-width="1.5"/>
  <text x="475" y="248" font-size="10" font-weight="700" fill="#7B8794" letter-spacing="1">DETERMINISTIC BUILD STEP</text>
  <text x="475" y="274" font-size="15" font-weight="700" fill="#051C2C" font-family="ui-monospace, Menlo, monospace">parse_ddrs.py</text>
  <text x="475" y="294" font-size="11" fill="#5C6B7A">parse &#8594; normalize &#8594; validate</text>
  <text x="475" y="310" font-size="11" fill="#5C6B7A">handles sentinels, units, missing fields</text>

  <!-- Box C: cache -->
  <rect x="830" y="220" width="290" height="96" rx="6" fill="#F4F6F8" stroke="#DBE1E8" stroke-width="1.5"/>
  <text x="850" y="248" font-size="10" font-weight="700" fill="#7B8794" letter-spacing="1">CLEAN CACHE</text>
  <text x="850" y="274" font-size="16" font-weight="700" fill="#051C2C">Parsed JSON</text>
  <text x="850" y="294" font-size="11" fill="#5C6B7A">data/parsed/ &#183; committed to repo</text>
  <text x="850" y="310" font-size="11" font-weight="600" fill="#0B7C8C">What the agent reads</text>

  <!-- connectors -->
  <line x1="375" y1="268" x2="448" y2="268" stroke="#7B8794" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="750" y1="268" x2="823" y2="268" stroke="#7B8794" stroke-width="2" marker-end="url(#arr)"/>

  <text x="80" y="352" font-size="13" fill="#5C6B7A" font-style="italic">Parsing is done before runtime &#8212; so the agent stays fast, cheap, and reproducible, and raw files never enter the model context.</text>

  <line x1="80" y1="380" x2="1120" y2="380" stroke="#DBE1E8" stroke-width="1.5"/>

  <!-- ===== Stage 2: The agent loop ===== -->
  <circle cx="92" cy="416" r="12" fill="#051C2C"/>
  <text x="92" y="421" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <text x="115" y="421" font-size="15" font-weight="700" fill="#051C2C" letter-spacing="0.5">THE AGENT LOOP</text>
  <text x="300" y="421" font-size="13" fill="#7B8794">runs on every request</text>

  <!-- User -->
  <rect x="300" y="446" width="600" height="50" rx="6" fill="#F4F6F8" stroke="#DBE1E8" stroke-width="1.5"/>
  <text x="320" y="470" font-size="10" font-weight="700" fill="#7B8794" letter-spacing="1">USER</text>
  <text x="320" y="488" font-size="13" fill="#051C2C" font-family="ui-monospace, Menlo, monospace">"Triage well 15/9-F-4. Produce the morning memo."</text>

  <line x1="600" y1="496" x2="600" y2="518" stroke="#7B8794" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Claude orchestrator -->
  <rect x="300" y="520" width="600" height="74" rx="8" fill="#051C2C"/>
  <text x="320" y="548" font-size="10" font-weight="700" fill="#00A9CE" letter-spacing="1.2">ORCHESTRATOR &#183; claude-sonnet-4-6</text>
  <text x="320" y="572" font-size="17" font-weight="700" fill="#ffffff">Tool-use loop</text>
  <text x="320" y="590" font-size="12" fill="#AEC4CE">Picks a tool &#8594; reads the result &#8594; picks the next.</text>

  <line x1="600" y1="594" x2="600" y2="612" stroke="#7B8794" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Tool table -->
  <rect x="80" y="614" width="1040" height="346" rx="8" fill="#ffffff" stroke="#DBE1E8" stroke-width="1.5"/>
  <rect x="80" y="614" width="5" height="346" rx="2.5" fill="#00A9CE"/>

  <text x="112" y="640" font-size="10" font-weight="700" fill="#7B8794" letter-spacing="1">STEP &#183; TOOL</text>
  <text x="600" y="640" font-size="10" font-weight="700" fill="#7B8794" letter-spacing="1">RETURNS</text>
  <text x="1096" y="640" text-anchor="end" font-size="10" font-weight="700" fill="#7B8794" letter-spacing="1">TOKENS OUT</text>
  <line x1="100" y1="652" x2="1100" y2="652" stroke="#ECEFF2" stroke-width="1"/>

  <!-- Row 1 -->
  <circle cx="116" cy="688" r="11" fill="#00A9CE"/><text x="116" y="692" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <text x="138" y="684" font-size="14" font-weight="700" fill="#051C2C" font-family="ui-monospace, Menlo, monospace">load_well_data</text>
  <text x="138" y="700" font-size="10" fill="#9AA5B1" font-family="ui-monospace, Menlo, monospace">(well_id)</text>
  <text x="600" y="692" font-size="12" fill="#3D4A57">metadata + 107 reports</text>
  <text x="1096" y="692" text-anchor="end" font-size="11" fill="#9AA5B1">~160</text>
  <line x1="100" y1="714" x2="1100" y2="714" stroke="#ECEFF2" stroke-width="1"/>

  <!-- Row 2 -->
  <circle cx="116" cy="740" r="11" fill="#00A9CE"/><text x="116" y="744" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <text x="138" y="736" font-size="14" font-weight="700" fill="#051C2C" font-family="ui-monospace, Menlo, monospace">classify_activities</text>
  <text x="138" y="752" font-size="10" fill="#9AA5B1" font-family="ui-monospace, Menlo, monospace">(well_id)</text>
  <text x="600" y="744" font-size="12" fill="#3D4A57">category + NPT subcategory counts</text>
  <text x="1096" y="744" text-anchor="end" font-size="11" fill="#9AA5B1">~145</text>
  <line x1="100" y1="766" x2="1100" y2="766" stroke="#ECEFF2" stroke-width="1"/>

  <!-- Row 3 -->
  <circle cx="116" cy="792" r="11" fill="#00A9CE"/><text x="116" y="796" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="138" y="788" font-size="14" font-weight="700" fill="#051C2C" font-family="ui-monospace, Menlo, monospace">compute_kpis</text>
  <text x="138" y="804" font-size="10" fill="#9AA5B1" font-family="ui-monospace, Menlo, monospace">(well_id)</text>
  <text x="600" y="796" font-size="12" fill="#3D4A57">24.6% NPT &#183; 8 anomalies &#183; breakdown</text>
  <text x="1096" y="796" text-anchor="end" font-size="11" fill="#9AA5B1">~812</text>
  <line x1="100" y1="818" x2="1100" y2="818" stroke="#ECEFF2" stroke-width="1"/>

  <!-- Row 4 -->
  <circle cx="116" cy="844" r="11" fill="#00A9CE"/><text x="116" y="848" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">4</text>
  <text x="138" y="840" font-size="14" font-weight="700" fill="#051C2C" font-family="ui-monospace, Menlo, monospace">build_chart</text>
  <text x="138" y="856" font-size="10" fill="#9AA5B1" font-family="ui-monospace, Menlo, monospace">(days_vs_depth)</text>
  <text x="600" y="848" font-size="12" fill="#3D4A57">Plotly spec &#183; x[107], y[107]</text>
  <text x="1096" y="848" text-anchor="end" font-size="11" fill="#9AA5B1">~375</text>
  <line x1="100" y1="870" x2="1100" y2="870" stroke="#ECEFF2" stroke-width="1"/>

  <!-- Row 5 -->
  <circle cx="116" cy="896" r="11" fill="#00A9CE"/><text x="116" y="900" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">5</text>
  <text x="138" y="892" font-size="14" font-weight="700" fill="#051C2C" font-family="ui-monospace, Menlo, monospace">build_chart</text>
  <text x="138" y="908" font-size="10" fill="#9AA5B1" font-family="ui-monospace, Menlo, monospace">(npt_pareto)</text>
  <text x="600" y="900" font-size="12" fill="#3D4A57">Plotly spec &#183; labels + values</text>
  <text x="1096" y="900" text-anchor="end" font-size="11" fill="#9AA5B1">~50</text>
  <line x1="100" y1="922" x2="1100" y2="922" stroke="#ECEFF2" stroke-width="1"/>

  <!-- Row 6 -->
  <circle cx="116" cy="948" r="11" fill="#00A9CE"/><text x="116" y="952" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">6</text>
  <text x="138" y="944" font-size="14" font-weight="700" fill="#051C2C" font-family="ui-monospace, Menlo, monospace">write_morning_memo</text>
  <text x="138" y="960" font-size="10" fill="#9AA5B1" font-family="ui-monospace, Menlo, monospace">(well_id, recommendation)</text>
  <text x="600" y="952" font-size="12" fill="#3D4A57">rendered markdown</text>
  <text x="1096" y="952" text-anchor="end" font-size="11" fill="#9AA5B1">~370</text>

  <!-- Loop-back arrow -->
  <path d="M 1120 786 C 1165 786, 1165 557, 905 557"
        stroke="#00A9CE" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arr-t)"/>
  <text x="1162" y="690" font-size="11" font-weight="600" fill="#00A9CE" text-anchor="middle"
        transform="rotate(90 1162 690)">Claude re-invoked after each result &#183; 6 iterations</text>

  <line x1="600" y1="960" x2="600" y2="982" stroke="#7B8794" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Output -->
  <rect x="300" y="984" width="600" height="82" rx="8" fill="#EAF7F9" stroke="#00A9CE" stroke-width="1.5"/>
  <text x="320" y="1011" font-size="10" font-weight="700" fill="#0B7C8C" letter-spacing="1">OUTPUT &#183; rendered in Streamlit</text>
  <text x="320" y="1035" font-size="15" font-weight="700" fill="#051C2C">Morning memo + Days-vs-Depth + NPT Pareto charts</text>
  <text x="320" y="1055" font-size="11" fill="#3D4A57">UI swaps {CHART:type} markers for the Plotly specs returned by build_chart.</text>

  <!-- ===== Takeaway band ===== -->
  <rect x="80" y="1098" width="1040" height="104" rx="8" fill="#051C2C"/>
  <text x="108" y="1132" font-size="12" font-weight="700" fill="#00A9CE" letter-spacing="2">THE TAKEAWAY</text>
  <text x="108" y="1162" font-size="17" font-weight="700" fill="#ffffff">Tools pass a well_id back and forth &#8212; never the 140k-token raw payload.</text>
  <text x="108" y="1186" font-size="13" fill="#AEC4CE">The model brings the judgment; the deterministic tools bring the numbers. Remove the tools and you get confident hallucination.</text>

  <!-- Source -->
  <text x="80" y="1240" font-size="11" fill="#9AA5B1">By Pushpesh &#160;&#183;&#160; github.com/Pushpesh-31/ddr-agent &#160;&#183;&#160; Data: Volve field, Equinor open data</text>

</svg>
