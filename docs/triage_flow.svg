<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1200"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
    <marker id="arr-loop" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="1100" height="1200" fill="#ffffff"/>

  <!-- Title -->
  <text x="550" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#111827">
    DDR Triage Agent — Tool-Use Loop
  </text>
  <text x="550" y="65" text-anchor="middle" font-size="14" fill="#6b7280">
    One Triage run = 6 tool calls orchestrated by Claude (claude-sonnet-4-6)
  </text>

  <!-- USER -->
  <g transform="translate(330, 100)">
    <rect width="440" height="60" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
    <text x="20" y="22" font-size="10" font-weight="700" fill="#6b7280" letter-spacing="0.5">USER</text>
    <text x="20" y="46" font-size="14" fill="#111827" font-family="ui-monospace, 'SF Mono', Menlo, monospace">"Triage well 15/9-F-4. Produce the morning memo."</text>
  </g>

  <line x1="550" y1="160" x2="550" y2="195" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- CLAUDE -->
  <g transform="translate(290, 200)">
    <rect width="520" height="80" rx="10" fill="#6366f1" stroke="#4338ca" stroke-width="1.5"/>
    <text x="20" y="22" font-size="10" font-weight="700" fill="#e0e7ff" letter-spacing="0.8">CLAUDE  ·  claude-sonnet-4-6</text>
    <text x="20" y="48" font-size="16" font-weight="600" fill="#ffffff">Tool-use loop</text>
    <text x="20" y="68" font-size="12" fill="#e0e7ff">Picks a tool → observes the result → picks the next.</text>
  </g>

  <!-- Loop arrow: tool results return to Claude -->
  <path d="M 920 950 C 1075 950, 1075 240, 815 240"
        stroke="#6366f1" stroke-width="2.5" stroke-dasharray="6,5" fill="none"
        marker-end="url(#arr-loop)"/>
  <text x="1078" y="600" font-size="12" fill="#6366f1" font-weight="600"
        text-anchor="middle" transform="rotate(90 1078 600)">
    ↻ Claude re-invoked after each tool result · 6 iterations
  </text>

  <!-- Tool 1 -->
  <line x1="550" y1="280" x2="550" y2="315" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(180, 320)">
    <rect width="740" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect width="6" height="80" rx="3" fill="#0ea5e9"/>
    <text x="22" y="22" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.6">1 · TOOL</text>
    <text x="22" y="46" font-size="16" font-weight="600" fill="#0f172a" font-family="ui-monospace, 'SF Mono', Menlo, monospace">load_well_data</text>
    <text x="22" y="66" font-size="12" fill="#6b7280" font-family="ui-monospace, 'SF Mono', Menlo, monospace">(well_id="15/9-F-4")</text>
    <text x="718" y="46" text-anchor="end" font-size="13" font-weight="600" fill="#059669">metadata + 107 reports</text>
    <text x="718" y="66" text-anchor="end" font-size="11" fill="#9ca3af" font-style="italic">~160 tokens out</text>
  </g>

  <!-- Tool 2 -->
  <line x1="550" y1="400" x2="550" y2="425" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(180, 430)">
    <rect width="740" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect width="6" height="80" rx="3" fill="#0ea5e9"/>
    <text x="22" y="22" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.6">2 · TOOL</text>
    <text x="22" y="46" font-size="16" font-weight="600" fill="#0f172a" font-family="ui-monospace, 'SF Mono', Menlo, monospace">classify_activities</text>
    <text x="22" y="66" font-size="12" fill="#6b7280" font-family="ui-monospace, 'SF Mono', Menlo, monospace">(well_id="15/9-F-4")</text>
    <text x="718" y="46" text-anchor="end" font-size="13" font-weight="600" fill="#059669">category + NPT subcategory counts</text>
    <text x="718" y="66" text-anchor="end" font-size="11" fill="#9ca3af" font-style="italic">~145 tokens out</text>
  </g>

  <!-- Tool 3 -->
  <line x1="550" y1="510" x2="550" y2="535" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(180, 540)">
    <rect width="740" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect width="6" height="80" rx="3" fill="#0ea5e9"/>
    <text x="22" y="22" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.6">3 · TOOL</text>
    <text x="22" y="46" font-size="16" font-weight="600" fill="#0f172a" font-family="ui-monospace, 'SF Mono', Menlo, monospace">compute_kpis</text>
    <text x="22" y="66" font-size="12" fill="#6b7280" font-family="ui-monospace, 'SF Mono', Menlo, monospace">(well_id="15/9-F-4")</text>
    <text x="718" y="46" text-anchor="end" font-size="13" font-weight="600" fill="#059669">24.6% NPT · 8 anomalies · breakdown</text>
    <text x="718" y="66" text-anchor="end" font-size="11" fill="#9ca3af" font-style="italic">~812 tokens out</text>
  </g>

  <!-- Tool 4 -->
  <line x1="550" y1="620" x2="550" y2="645" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(180, 650)">
    <rect width="740" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect width="6" height="80" rx="3" fill="#0ea5e9"/>
    <text x="22" y="22" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.6">4 · TOOL</text>
    <text x="22" y="46" font-size="16" font-weight="600" fill="#0f172a" font-family="ui-monospace, 'SF Mono', Menlo, monospace">build_chart</text>
    <text x="22" y="66" font-size="12" fill="#6b7280" font-family="ui-monospace, 'SF Mono', Menlo, monospace">(chart_type="days_vs_depth", well_id=…)</text>
    <text x="718" y="46" text-anchor="end" font-size="13" font-weight="600" fill="#059669">Plotly spec · x[107], y[107]</text>
    <text x="718" y="66" text-anchor="end" font-size="11" fill="#9ca3af" font-style="italic">~375 tokens out</text>
  </g>

  <!-- Tool 5 -->
  <line x1="550" y1="730" x2="550" y2="755" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(180, 760)">
    <rect width="740" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect width="6" height="80" rx="3" fill="#0ea5e9"/>
    <text x="22" y="22" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.6">5 · TOOL</text>
    <text x="22" y="46" font-size="16" font-weight="600" fill="#0f172a" font-family="ui-monospace, 'SF Mono', Menlo, monospace">build_chart</text>
    <text x="22" y="66" font-size="12" fill="#6b7280" font-family="ui-monospace, 'SF Mono', Menlo, monospace">(chart_type="npt_pareto", well_id=…)</text>
    <text x="718" y="46" text-anchor="end" font-size="13" font-weight="600" fill="#059669">Plotly spec · labels + values</text>
    <text x="718" y="66" text-anchor="end" font-size="11" fill="#9ca3af" font-style="italic">~50 tokens out</text>
  </g>

  <!-- Tool 6 -->
  <line x1="550" y1="840" x2="550" y2="865" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>
  <g transform="translate(180, 870)">
    <rect width="740" height="80" rx="8" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
    <rect width="6" height="80" rx="3" fill="#0ea5e9"/>
    <text x="22" y="22" font-size="10" font-weight="700" fill="#0369a1" letter-spacing="0.6">6 · TOOL</text>
    <text x="22" y="46" font-size="16" font-weight="600" fill="#0f172a" font-family="ui-monospace, 'SF Mono', Menlo, monospace">write_morning_memo</text>
    <text x="22" y="66" font-size="12" fill="#6b7280" font-family="ui-monospace, 'SF Mono', Menlo, monospace">(well_id=…, recommendation=…)</text>
    <text x="718" y="46" text-anchor="end" font-size="13" font-weight="600" fill="#059669">rendered markdown</text>
    <text x="718" y="66" text-anchor="end" font-size="11" fill="#9ca3af" font-style="italic">~370 tokens out · 1,471 chars</text>
  </g>

  <line x1="550" y1="950" x2="550" y2="985" stroke="#4b5563" stroke-width="2" marker-end="url(#arr)"/>

  <!-- OUTPUT -->
  <g transform="translate(290, 990)">
    <rect width="520" height="100" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="22" font-size="10" font-weight="700" fill="#047857" letter-spacing="0.6">FINAL OUTPUT  ·  rendered in Streamlit</text>
    <text x="20" y="48" font-size="15" font-weight="600" fill="#064e3b">Morning memo + Days-vs-Depth chart + NPT Pareto chart</text>
    <text x="20" y="70" font-size="12" fill="#047857">The UI captures chart specs from build_chart ToolResults and renders</text>
    <text x="20" y="88" font-size="12" fill="#047857">them in place of {CHART:type} markers inside the memo markdown.</text>
  </g>

  <!-- Footer insight -->
  <text x="550" y="1140" text-anchor="middle" font-size="13" font-weight="600" fill="#6366f1">
    Key design: tools pass well_id back and forth — not the 140k-token raw payload.
  </text>
  <text x="550" y="1160" text-anchor="middle" font-size="11" fill="#6b7280">
    Each tool re-loads what it needs server-side. The LLM context stays compact across all 6 iterations.
  </text>

</svg>
